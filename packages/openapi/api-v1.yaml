    post:
      operationId: exchangeAuthSession
      tags:
        - Auth
      summary: Exchange credentials or provider token for mobile auth tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: ['credentials', 'google', 'apple', 'session']
                email:
                  type: string
                  format: email
                password:
                  type: string
                idToken:
                  type: string
                name:
                  type: string
                authCode:
                  type: string
                redirectUri:
                  type: string
                twoFactorToken:
                  type: string
                deviceInfo:
                  type: string

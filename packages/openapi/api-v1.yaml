              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                required:
                  - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Pair expired or already claimed
          content:
            application/json:
              schema:

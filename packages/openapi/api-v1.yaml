  # ─── Authentication ────────────────────────────────────────────────────────

  /api/v1/desktopAuth/start:
    post:
      operationId: startDesktopAuth
      tags:
        - DesktopAuth
      summary: Start a desktop ↔ web Google pairing session (PKCE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codeChallenge:
                  type: string
                  description: S256 base64url PKCE code challenge
                deviceInfo:
                  type: string
              required:
                - codeChallenge
      responses:
        '200':
          description: Pairing session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pairId:
                        type: string
                        format: uuid
                      expiresAt:
                        type: string
                        format: date-time
                      authorizeUrl:
                        type: string
                        format: uri
                    required:
                      - pairId
                      - expiresAt
                      - authorizeUrl
                required:
                  - data
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/desktopAuth/complete:
    post:
      operationId: completeDesktopAuth
      tags:
        - DesktopAuth
      summary: Bind the signed-in web user to a desktop auth pair
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pairId:
                  type: string
                  format: uuid
              required:
                - pairId
      responses:
        '200':
          description: Pair bound to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: ['bound']
                    required:
                      - status
                required:
                  - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Pair expired or already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/desktopAuth/claim:
    post:
      operationId: claimDesktopAuth

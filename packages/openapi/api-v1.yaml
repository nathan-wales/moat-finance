components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                    enum: ['Unauthorized']
                required:
                  - message
            required:
              - error

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
            required:
              - error

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
            required:
              - error

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
            required:
              - error

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
            required:
              - error

  schemas:
    TransactionImportColumnMapping:
      type: object
      properties:
        date:
          type: string
        amount:
          type: string
        description:
          type: string
        type:
          type: string
        category:
          type: string
        memo:
          type: string
        account:
          type: string
      required:
        - date
        - amount
    ImportMappingTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        accountId:
          type: string
          nullable: true
        mapping:
          $ref: '#/components/schemas/TransactionImportColumnMapping'
      required:
        - id
        - name
        - isDefault
        - accountId
        - mapping
    CreateImportMappingTemplateInput:
      type: object
      properties:
        name:
          type: string
        mapping:
          $ref: '#/components/schemas/TransactionImportColumnMapping'
        accountId:
          type: string
          nullable: true
        isDefault:
          type: boolean
      required:
        - name
        - mapping
    UpdateImportMappingTemplateInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mapping:
          $ref: '#/components/schemas/TransactionImportColumnMapping'
        accountId:
          type: string
          nullable: true
        isDefault:
          type: boolean
      required:
        - id
    TransactionImportJsonRow:
      type: object
      properties:
        date:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: ['INCOME', 'EXPENSE']
        description:
          type: string
        originalDescription:
          type: string
        category:
          type: string
        account:
          type: string
        dedupKey:
          type: string
      required:
        - date
        - amount
    TransactionImportPreviewInput:
      type: object
      properties:
        accountId:
          type: string
        sampleSize:
          type: integer
          minimum: 1
          maximum: 100
        sampleOffset:
          type: integer
          minimum: 0
          maximum: 5000
        csvText:
          type: string
        templateId:
          type: string
        filePath:
          type: string
        mapping:
          $ref: '#/components/schemas/TransactionImportColumnMapping'
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TransactionImportJsonRow'
        rawRows:
          type: array
          items:
            type: object
            additionalProperties: true
    TransactionImportCommitInput:
      allOf:
        - $ref: '#/components/schemas/TransactionImportPreviewInput'
        - type: object
          properties:
            confirmed:
              type: boolean
              enum: [true]
            confirmedNewCount:
              type: integer
              minimum: 0
              maximum: 5000
          required:
            - confirmed
            - confirmedNewCount
    TransactionImportSampleRow:
      type: object
      properties:
        date:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: ['INCOME', 'EXPENSE']
        description:
          type: string
        category:
          type: string
      required:
        - date
        - amount
        - type
        - description
    TransactionImportPreview:
      type: object
      properties:
        newCount:
          type: integer
        duplicateCount:
          type: integer
        invalidCount:
          type: integer
        headers:
          type: array
          items:
            type: string
        sample:
          type: array
          items:
            $ref: '#/components/schemas/TransactionImportSampleRow'
        categoryColumnMapped:
          type: boolean
        uncategorizedWarning:
          type: string
          nullable: true
      required:
        - newCount
        - duplicateCount
        - invalidCount
        - headers
        - sample
        - categoryColumnMapped
        - uncategorizedWarning
    TransactionImportCommitResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        newCount:
          type: integer
        duplicateCount:
          type: integer
        invalidCount:
          type: integer
      required:
        - imported
        - skipped
        - newCount
        - duplicateCount
        - invalidCount
    TransactionImportError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
              enum:
                - TOO_MANY_ROWS
                - INVALID_SOURCE
                - ACCOUNT_NOT_FOUND
                - PAYLOAD_TOO_LARGE
                - FILE_PATH_NOT_SUPPORTED
                - TEMPLATE_NOT_FOUND
                - confirmation_mismatch
            actualNewCount:
              type: integer
            duplicateCount:
              type: integer
            invalidCount:
              type: integer
          required:
            - message
      required:
        - error
    RetailTransactionDetection:
      type: object
      properties:
        retailer:
          type: string
          enum: ['amazon']
        detectedCount:
          type: integer
        unlinkedDetectedCount:
          type: integer
        linkedItemCount:
          type: integer
        hasActionableSync:
          type: boolean
        extensionStatus:
          type: string
          enum: ['unknown', 'connected', 'not_connected']
        candidates:
          type: array
          items:
            type: object
            properties:
              transactionId:
                type: string
              confidence:
                type: string
                enum: ['high', 'medium', 'low']
              linkedItemCount:
                type: integer
              needsSync:
                type: boolean
            required:
              - transactionId
              - confidence
              - linkedItemCount
              - needsSync
      required:
        - retailer
        - detectedCount
        - unlinkedDetectedCount
        - linkedItemCount
        - hasActionableSync
        - extensionStatus
        - candidates

    RetailMatchingResult:
      type: object
      properties:
        linkedItems:
          type: integer
        candidates:
          type: integer
        skipped:
          type: integer
        warnings:
          type: array
          items:
            type: string
      required:
        - linkedItems
        - candidates
        - skipped
        - warnings

    RetailItemsForTransactions:
      type: object
      properties:
        itemsByTransactionId:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                retailer:
                  type: string
                  enum: ['amazon']
                title:
                  type: string
                quantity:
                  type: integer
                  nullable: true
                totalPrice:
                  type: number
                  nullable: true
                unitPrice:
                  type: number
                  nullable: true
                imageUrl:
                  type: string
                  nullable: true
                orderDate:
                  type: string
                  format: date-time
                  nullable: true
                externalOrderId:
                  type: string
              required:
                - id
                - retailer
                - title
                - quantity
                - totalPrice
                - unitPrice
                - imageUrl
                - orderDate
                - externalOrderId
      required:
        - itemsByTransactionId

    CategoryParent:
      type: string
      nullable: true
      enum:
        - FIXED
        - FLEXIBLE
        - NON_MONTHLY
        - null
      description: Spend parent bucket. Null for income and transfer categories.

    Category:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          nullable: true
        name:
          type: string
        icon:
          type: string
          nullable: true
          description: Curated category icon key (lucide kebab-case name)
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: "Hex color like #16A34A"
        isDefault:
          type: boolean
        isHidden:
          type: boolean
        isRemoved:
          type: boolean
          description: True when the current user has removed this default category from their list
        canDelete:
          type: boolean
        canHide:
          type: boolean
        sortOrder:
          type: integer
        parentCategory:
          $ref: '#/components/schemas/CategoryParent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - isDefault
        - isHidden
        - isRemoved
        - canDelete
        - canHide
        - sortOrder
        - parentCategory
        - createdAt
        - updatedAt

    FinancialDataProvider:
      type: string
      enum: ['PLAID', 'MX', 'FINICITY']

    InstitutionCategory:
      type: string
      enum:
        - BANK
        - CREDIT_CARD
        - INVESTMENT
        - CREDIT_UNION
        - FINTECH
        - CRYPTO
        - LOAN

        - PAYROLL
        - UNKNOWN

    InstitutionSearchResult:
      type: object
      properties:
        canonicalInstitutionId:
          type: string
        displayName:
          type: string
        legalName:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
        logoUrl:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/InstitutionCategory'
        recommendedProvider:
          $ref: '#/components/schemas/FinancialDataProvider'
        availableProviders:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDataProvider'
        recommendationReason:
          type: string
        confidence:
          type: string
          enum: ['HIGH', 'MEDIUM', 'LOW', 'MANUAL']
        supportedProducts:
          type: object
          properties:
            transactions:
              type: boolean
            investments:
              type: boolean
            liabilities:
              type: boolean
            identity:
              type: boolean

            statements:
              type: boolean
          required:
            - transactions
            - investments
            - liabilities
            - identity
            - statements
        providerMappings:
          type: array
          items:
            type: object
            properties:
              provider:
                $ref: '#/components/schemas/FinancialDataProvider'
              providerInstitutionId:
                type: string
              providerInstitutionName:
                type: string
              status:
                type: string
                nullable: true
              supportsOAuth:
                type: boolean
                nullable: true
            required:
              - provider
              - providerInstitutionId
              - providerInstitutionName
      required:
        - canonicalInstitutionId
        - displayName
        - aliases
        - recommendedProvider
        - availableProviders
        - confidence
        - supportedProducts
        - providerMappings

    FinancialConnectionRouting:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/FinancialDataProvider'
        reason:
          type: string
        confidence:
          type: string
          enum: ['MANUAL', 'HIGH', 'MEDIUM', 'LOW']
        availableProviders:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDataProvider'
      required:
        - provider
        - reason
        - confidence
        - availableProviders

    FinancialConnectionLinkSession:
      oneOf:
        - type: object
          properties:
            provider:

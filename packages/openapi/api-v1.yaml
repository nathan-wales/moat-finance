    get:
      operationId: getSignupStatus
      tags:
        - Auth
      summary: Whether this instance accepts new sign-ups
      description: >-
        Public and unauthenticated. Returns only the instance-wide sign-up flag
        (never the allowlist). Responses may be cached briefly. Sign-up is still
        enforced server-side on register and first-time OAuth sign-in.
      responses:
        '200':
          description: Current sign-up status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signupsEnabled:
                        type: boolean
                    required:
                      - signupsEnabled
                required:
                  - data

  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags:
        - Auth
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                source:
                  type: string
                  enum: [web, desktop]
                  description: Signup surface. Desktop Local uses this to send local-first welcome copy.
                marketingAttribution:
                  type: object
                  additionalProperties: true
                  description: First and latest audience-page touch. Ignored unless this request creates the account.
              required:
                - name
                - email
                - password
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                    required:
                      - id
                      - email
                      - name
                required:
                  - data
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

